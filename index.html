<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دردشة الموبايل الذكية</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root, [data-theme="dark"] {
      --bg-body: #050811;
      --bg-app: #0b1120;
      --bg-card: #111c31;
      --bg-hover: #1e293b;
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --bubble-them: #1e293b;
      --online: #10b981;
      --offline: #64748b;
      --danger: #ef4444;
    }

    [data-theme="emerald"] {
      --bg-body: #021a12;
      --bg-app: #06281e;
      --bg-card: #0b382b;
      --bg-hover: #134e3d;
      --primary: #10b981;
      --primary-gradient: linear-gradient(135deg, #059669, #10b981);
      --text: #f0fdf4;
      --text-muted: #a7f3d0;
      --border: #134e3d;
      --bubble-them: #0b382b;
      --online: #34d399;
      --offline: #64748b;
      --danger: #f87171;
    }

    [data-theme="light"] {
      --bg-body: #e2e8f0;
      --bg-app: #ffffff;
      --bg-card: #f8fafc;
      --bg-hover: #f1f5f9;
      --primary: #2563eb;
      --primary-gradient: linear-gradient(135deg, #2563eb, #3b82f6);
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --bubble-them: #e2e8f0;
      --online: #16a34a;
      --offline: #94a3b8;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-body);
      color: var(--text);
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: background 0.3s;
    }

    .mobile-app {
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }

    @media (min-width: 768px) {
      .mobile-app {
        height: 94dvh;
        max-height: 840px;
        border-radius: 26px;
      }
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
      transition: transform 0.25s ease-in-out;
      z-index: 10;
    }

    .screen.hidden-left { transform: translateX(100%); pointer-events: none; }

    .app-header {
      padding: 12px 16px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
    }

    .user-profile-badge { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      object-fit: cover; background: #334155; border: 2px solid rgba(255,255,255,0.4);
    }
    .avatar-sm { width: 38px; height: 38px; }

    .id-tag {
      font-size: 0.72rem;
      background: rgba(0,0,0,0.25);
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-block;
      margin-top: 3px;
    }

    .header-icons { display: flex; gap: 6px; }

    .chat-list-container { flex: 1; overflow-y: auto; }
    .chat-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .chat-item:active { background: var(--bg-hover); }

    .chat-item-info { flex: 1; overflow: hidden; }
    .chat-item-name { font-weight: 600; font-size: 0.95rem; }
    .chat-item-sub { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.online { background: var(--online); }
    .status-dot.offline { background: var(--offline); }

    .chat-screen-header {
      padding: 10px 14px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }

    .back-btn {
      background: none; border: none; color: var(--text);
      font-size: 1.4rem; cursor: pointer; padding: 4px 6px;
    }

    .chat-person-details { flex: 1; overflow: hidden; }
    .chat-person-name { font-weight: bold; font-size: 0.95rem; }
    .chat-person-status { font-size: 0.72rem; color: var(--text-muted); }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .msg-box {
      max-width: 82%; padding: 8px 12px; border-radius: 14px;
      position: relative; word-wrap: break-word; font-size: 0.92rem;
    }
    .msg-box.me {
      align-self: flex-start; background: var(--primary-gradient);
      color: white; border-bottom-right-radius: 2px;
    }
    .msg-box.them {
      align-self: flex-end; background: var(--bubble-them);
      color: var(--text); border-bottom-left-radius: 2px;
    }

    .msg-top-action { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .msg-actions-btn { background: none; border: none; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 1rem; }

    .msg-context-menu {
      position: absolute; top: 25px; left: 0; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 20; display: none;
      flex-direction: column; min-width: 130px;
    }
    .msg-context-menu.show { display: flex; }
    .msg-context-menu button {
      background: none; border: none; color: var(--text); padding: 8px 12px;
      text-align: right; font-size: 0.8rem; cursor: pointer;
    }
    .msg-context-menu button:hover { background: var(--bg-hover); }

    .msg-meta { font-size: 0.65rem; opacity: 0.7; margin-top: 3px; display: flex; gap: 6px; }

    .msg-media { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 5px; display: block; }
    audio { width: 200px; height: 35px; margin-top: 5px; }

    /* مؤشر التحميل المتطور مع شريط التقدم */
    .loader-box {
      display: flex; flex-direction: column; gap: 6px; padding: 6px 0; font-size: 0.8rem;
    }
    .loader-row { display: flex; align-items: center; gap: 8px; }
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-bar-bg {
      width: 100%; height: 5px; background: rgba(0,0,0,0.25); border-radius: 4px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: #ffffff; transition: width 0.15s ease;
    }

    .chat-bottom-bar {
      padding: 10px; background: var(--bg-card); border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px;
    }
    .chat-bottom-bar input[type="text"] {
      flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg-app); color: var(--text); outline: none; font-size: 0.9rem;
    }

    .round-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg-app); color: var(--text); display: flex; align-items: center;
      justify-content: center; cursor: pointer; font-size: 1rem;
    }
    .round-btn.send { background: var(--primary-gradient); color: #fff; border: none; }
    .round-btn.recording { background: var(--danger); color: #fff; animation: pulse 1s infinite alternate; }

    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none;
      justify-content: center; align-items: center; z-index: 50; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    }

    .form-input {
      padding: 11px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-app); color: var(--text); font-size: 0.95rem; outline: none;
    }
    .btn-submit {
      padding: 11px; border-radius: 10px; border: none; background: var(--primary-gradient);
      color: white; font-weight: bold; cursor: pointer; font-size: 0.95rem;
    }

    .onboarding-screen {
      position: absolute; inset: 0; background: var(--bg-app); z-index: 100;
      display: flex; flex-direction: column; justify-content: center; padding: 24px; gap: 14px;
    }
    .gender-selector { display: flex; gap: 10px; }
    .gender-option {
      flex: 1; padding: 12px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; text-align: center; cursor: pointer; font-weight: bold;
    }
    .gender-option.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.15); }
  </style>
</head>
<body>

<div class="mobile-app">
  <!-- 1. شاشة البداية / التسجيل لأول مرة -->
  <div class="onboarding-screen" id="onboardingScreen" style="display: none;">
    <h2 style="text-align:center;">مرحباً بك 👋</h2>
    <p style="text-align:center;font-size:0.85rem;color:var(--text-muted);">يرجى تحديد بياناتك للدخول</p>
    <input type="text" id="ob-name" class="form-input" placeholder="اسمك المستعار">
    <input type="number" id="ob-age" class="form-input" placeholder="العمر">
    <div class="gender-selector">
      <div class="gender-option active" id="gender-male" onclick="setGender('male')">👦 ذكر</div>
      <div class="gender-option" id="gender-female" onclick="setGender('female')">👧 أنثى</div>
    </div>
    <button class="btn-submit" onclick="finishOnboarding()">دخول</button>
  </div>

  <!-- 2. الشاشة الرئيسية: قائمة المحادثات -->
  <div class="screen" id="homeScreen">
    <header class="app-header">
      <div class="user-profile-badge">
        <img id="my-avatar" class="avatar" src="" alt="avatar">
        <div>
          <div style="font-weight: bold; font-size: 0.95rem;"><span id="my-name">--</span> (<span id="my-age">--</span>)</div>
          <div class="id-tag" onclick="copyInviteLink()" title="انقر لنسخ رابط الدعوة">رابط الدعوة 🔗</div>
        </div>
      </div>
      <div class="header-icons">
        <button class="round-btn" onclick="toggleTheme()" title="تغيير الثيم">🎨</button>
        <button class="round-btn" onclick="openAddModal()" title="إضافة شخص">➕</button>
      </div>
    </header>
    <div class="chat-list-container" id="chatList"></div>
  </div>

  <!-- 3. شاشة المحادثة الفردية -->
  <div class="screen hidden-left" id="chatScreen">
    <div class="chat-screen-header">
      <button class="back-btn" onclick="goBackToHome()">⬅️</button>
      <img id="chat-person-avatar" class="avatar avatar-sm" src="" alt="avatar">
      <div class="chat-person-details">
        <div class="chat-person-name" id="chat-person-name">--</div>
        <div class="chat-person-status" id="chat-person-status">
          <span class="status-dot offline" id="chat-status-dot"></span>
          <span id="chat-status-text">غير متصل</span>
        </div>
      </div>
      <button class="round-btn" style="border:none;background:transparent;color:var(--danger);" onclick="deleteEntireChat()" title="حذف الدردشة للطرفين">🗑️</button>
    </div>

    <div class="chat-messages" id="messagesArea"></div>

    <div class="chat-bottom-bar">
      <label class="round-btn" title="إرفاق ملف">
        📎
        <input type="file" id="media-input" accept="image/*,video/*" style="display:none;" onchange="handleMediaUpload(event)">
      </label>
      <button class="round-btn" id="voice-record-btn" onclick="toggleVoiceRecording()" title="تسجيل صوتي">🎤</button>
      <input type="text" id="message-text-input" placeholder="اكتب رسالة..." onkeypress="if(event.key === 'Enter') sendTextMessage()">
      <button class="round-btn send" onclick="sendTextMessage()">➤</button>
    </div>
  </div>

  <!-- نافذة إضافة شخص -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-box">
      <h3 style="font-size:1rem;">إضافة صديق برقم الشات</h3>
      <input type="text" id="add-friend-name" class="form-input" placeholder="اسم الصديق">
      <input type="number" id="add-friend-id" class="form-input" placeholder="رقم الشات الخاص به">
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="round-btn" style="width:auto;padding:8px 16px;border-radius:8px;" onclick="closeModals()">إلغاء</button>
        <button class="btn-submit" onclick="addFriendManual()">إضافة</button>
      </div>
    </div>
  </div>
</div>

<script>
  const BOY_AVATAR = 'https://api.dicebear.com/7.x/bottts/svg?seed=Felix&backgroundColor=b6e3f4';
  const GIRL_AVATAR = 'https://api.dicebear.com/7.x/bottts/svg?seed=Aneka&backgroundColor=ffd5dc';
  const CHUNK_SIZE = 16 * 1024; // 16KB لكل جزء لتجنب اختناق WebRTC DataChannel

  // ==================== 1. نظام التخزين الكبير عبر IndexedDB ====================
  let db;
  function initDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('ChatMediaDB', 1);
      request.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('media_store')) {
          d.createObjectStore('media_store');
        }
      };
      request.onsuccess = (e) => {
        db = e.target.result;
        resolve(db);
      };
      request.onerror = (e) => reject(e);
    });
  }

  function saveMediaBlob(key, blob) {
    return new Promise((resolve) => {
      if (!db) return resolve(null);
      const tx = db.transaction('media_store', 'readwrite');
      const store = tx.objectStore('media_store');
      store.put(blob, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  }

  function getMediaBlob(key) {
    return new Promise((resolve) => {
      if (!db) return resolve(null);
      const tx = db.transaction('media_store', 'readonly');
      const store = tx.objectStore('media_store');
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  }

  function deleteMediaBlob(key) {
    if (!db) return;
    const tx = db.transaction('media_store', 'readwrite');
    tx.objectStore('media_store').delete(key);
  }

  // ==================== 2. الهوية والإعدادات ====================
  function getMyFixedId() {
    let id = localStorage.getItem('chat_fixed_device_id');
    if (!id || !/^\d{7}$/.test(id)) {
      id = String(Math.floor(1000000 + Math.random() * 9000000));
      localStorage.setItem('chat_fixed_device_id', id);
    }
    return id;
  }

  const myId = getMyFixedId();
  let myProfile = JSON.parse(localStorage.getItem('chat_my_profile')) || null;
  let contacts = JSON.parse(localStorage.getItem('chat_contacts_list')) || [];
  let chatHistory = JSON.parse(localStorage.getItem('chat_history_data')) || {};
  let offlineQueue = JSON.parse(localStorage.getItem('chat_offline_queue')) || {};

  let activeChatId = null;
  let selectedGender = 'male';
  let peer = null;
  let connections = {};
  let incomingChunks = {}; // تخزين الأجزاء المستلمة مؤقتاً { msgId: { chunks: [], total, received, type } }

  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  const THEMES = ['dark', 'emerald', 'light'];
  let currentTheme = localStorage.getItem('chat_theme') || 'dark';

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('chat_theme', t);
  }
  function toggleTheme() {
    const nextIdx = (THEMES.indexOf(currentTheme) + 1) % THEMES.length;
    currentTheme = THEMES[nextIdx];
    applyTheme(currentTheme);
  }

  function playNotificationSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    } catch(e) {}
  }

  // ==================== 3. فحص البداية ورابط الدعوة ====================
  function checkInviteLink() {
    const hash = window.location.hash;
    if (hash.startsWith('#invite=')) {
      const inviteId = hash.replace('#invite=', '').trim();
      if (inviteId && inviteId !== myId) {
        if (!contacts.some(c => c.id === inviteId)) {
          contacts.push({ id: inviteId, name: 'صديق ' + inviteId, avatar: BOY_AVATAR });
          saveContacts();
          renderChatList();
        }
        setTimeout(() => openChat(inviteId), 300);
      }
      history.replaceState(null, null, ' ');
    }
  }

  function copyInviteLink() {
    const url = window.location.origin + window.location.pathname + '#invite=' + myId;
    navigator.clipboard.writeText(url);
    alert('تم نسخ رابط الدعوة الخاص بك بنجاح!');
  }

  async function checkOnboarding() {
    await initDB();
    applyTheme(currentTheme);
    if (!myProfile) {
      document.getElementById('onboardingScreen').style.display = 'flex';
    } else {
      loadProfileUI();
      renderChatList();
      initPeer();
      checkInviteLink();
    }
  }

  function setGender(g) {
    selectedGender = g;
    document.getElementById('gender-male').classList.toggle('active', g === 'male');
    document.getElementById('gender-female').classList.toggle('active', g === 'female');
  }

  function finishOnboarding() {
    const name = document.getElementById('ob-name').value.trim();
    const age = document.getElementById('ob-age').value.trim();
    if (!name || !age) return alert('يرجى ملء الاسم والعمر');

    myProfile = {
      name, age, gender: selectedGender,
      avatar: selectedGender === 'male' ? BOY_AVATAR : GIRL_AVATAR
    };
    localStorage.setItem('chat_my_profile', JSON.stringify(myProfile));
    document.getElementById('onboardingScreen').style.display = 'none';
    loadProfileUI();
    renderChatList();
    initPeer();
    checkInviteLink();
  }

  function loadProfileUI() {
    document.getElementById('my-name').textContent = myProfile.name;
    document.getElementById('my-age').textContent = myProfile.age;
    document.getElementById('my-avatar').src = myProfile.avatar;
  }

  // ==================== 4. الاتصال الحي P2P عبر PeerJS ====================
  function initPeer() {
    peer = new Peer('chat-' + myId, { debug: 1 });

    peer.on('connection', (conn) => {
      const incomingId = conn.peer.replace('chat-', '');
      connections[incomingId] = conn;
      setupConn(conn, incomingId);

      if (!contacts.some(c => c.id === incomingId)) {
        contacts.push({ id: incomingId, name: 'صديق ' + incomingId, avatar: BOY_AVATAR });
        saveContacts();
        renderChatList();
      }
    });

    peer.on('disconnected', () => {
      try { peer.reconnect(); } catch(e){}
    });
  }

  function connectToFriend(friendId) {
    if (connections[friendId] && connections[friendId].open) return;
    const conn = peer.connect('chat-' + friendId, { reliable: true });
    connections[friendId] = conn;
    setupConn(conn, friendId);
  }

  function setupConn(conn, friendId) {
    conn.on('open', () => {
      updateOnlineStatus(friendId, true);
      flushOfflineQueue(friendId);
    });

    conn.on('data', (packet) => {
      handleIncomingData(friendId, packet);
    });

    conn.on('close', () => updateOnlineStatus(friendId, false));
    conn.on('error', () => updateOnlineStatus(friendId, false));
  }

  function updateOnlineStatus(friendId, isOnline) {
    if (activeChatId === friendId) {
      const dot = document.getElementById('chat-status-dot');
      const txt = document.getElementById('chat-status-text');
      dot.className = 'status-dot ' + (isOnline ? 'online' : 'offline');
      txt.textContent = isOnline ? 'متصل الآن' : 'غير متصل';
    }
  }

  function flushOfflineQueue(friendId) {
    if (offlineQueue[friendId] && offlineQueue[friendId].length > 0) {
      offlineQueue[friendId].forEach(pkt => connections[friendId].send(pkt));
      offlineQueue[friendId] = [];
      localStorage.setItem('chat_offline_queue', JSON.stringify(offlineQueue));
    }
  }

  // ==================== 5. معالجة الرسائل واستقبال الملفات المقطعة ====================
  async function handleIncomingData(friendId, data) {
    // استقبال جزء من وسائط كبيرة (Chunking)
    if (data.action === 'chunk_start') {
      incomingChunks[data.msgId] = {
        meta: data.msg,
        chunks: [],
        total: data.totalChunks,
        received: 0,
        mimeType: data.mimeType
      };

      // إضافة فقاعة قيد التحميل لدى المستقبل
      if (!chatHistory[friendId]) chatHistory[friendId] = [];
      chatHistory[friendId].push(data.msg);
      saveChatHistory();
      if (activeChatId === friendId) renderMessages();
      return;
    }

    if (data.action === 'chunk_data') {
      const session = incomingChunks[data.msgId];
      if (!session) return;

      session.chunks[data.index] = data.chunk;
      session.received++;

      // تحديث شريط التقدم عند المستقبل
      const percent = Math.floor((session.received / session.total) * 100);
      updateProgressUI(data.msgId, percent);

      if (session.received === session.total) {
        // اكتمال الملف بالكامل -> دمجه
        const blob = new Blob(session.chunks, { type: session.mimeType });
        await saveMediaBlob(data.msgId, blob);

        const m = (chatHistory[friendId] || []).find(x => x.id === data.msgId);
        if (m) {
          m.loading = false;
          m.mediaKey = data.msgId; // مفتاح IndexedDB
          saveChatHistory();
          if (activeChatId === friendId) renderMessages();
        }
        delete incomingChunks[data.msgId];
        playNotificationSound();
      }
      return;
    }

    playNotificationSound();

    if (data.action === 'msg') {
      if (!chatHistory[friendId]) chatHistory[friendId] = [];
      chatHistory[friendId].push(data.msg);
      saveChatHistory();
      if (activeChatId === friendId) renderMessages();
    } else if (data.action === 'edit') {
      const m = (chatHistory[friendId] || []).find(x => x.id === data.msgId);
      if (m) {
        m.content = data.newContent;
        m.edited = true;
        saveChatHistory();
        if (activeChatId === friendId) renderMessages();
      }
    } else if (data.action === 'delete_everyone') {
      const m = (chatHistory[friendId] || []).find(x => x.id === data.msgId);
      if (m) {
        m.deletedEveryone = true;
        deleteMediaBlob(m.mediaKey);
        saveChatHistory();
        if (activeChatId === friendId) renderMessages();
      }
    } else if (data.action === 'delete_entire_chat') {
      (chatHistory[friendId] || []).forEach(m => { if (m.mediaKey) deleteMediaBlob(m.mediaKey); });
      chatHistory[friendId] = [];
      saveChatHistory();
      if (activeChatId === friendId) renderMessages();
    }
  }

  function sendPacket(targetId, packet) {
    const conn = connections[targetId];
    if (conn && conn.open) {
      conn.send(packet);
    } else {
      if (!offlineQueue[targetId]) offlineQueue[targetId] = [];
      offlineQueue[targetId].push(packet);
      localStorage.setItem('chat_offline_queue', JSON.stringify(offlineQueue));
    }
  }

  function updateProgressUI(msgId, percent) {
    const fill = document.getElementById('fill-' + msgId);
    const txt = document.getElementById('txt-' + msgId);
    if (fill) fill.style.width = percent + '%';
    if (txt) txt.textContent = percent + '%';
  }

  // ==================== 6. إرسال الوسائط بنظام التقطيع الآمن ====================
  async function sendMediaChunked(fileOrBlob, type, targetId) {
    const msgId = Date.now() + '-' + Math.random().toString(36).substr(2, 4);

    // 1. حفظ في IndexedDB المحلي فوراً
    await saveMediaBlob(msgId, fileOrBlob);

    // 2. إنشاء رسالة مع مؤشر تحميل
    const msg = {
      id: msgId,
      sender: myId,
      type: type,
      mediaKey: msgId,
      loading: true,
      time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
      edited: false,
      deletedEveryone: false,
      deletedForMe: false
    };

    if (!chatHistory[targetId]) chatHistory[targetId] = [];
    chatHistory[targetId].push(msg);
    saveChatHistory();
    renderMessages();

    // 3. تقسيم الملف إلى مصفوفة بايتات
    const arrayBuffer = await fileOrBlob.arrayBuffer();
    const totalBytes = arrayBuffer.byteLength;
    const totalChunks = Math.ceil(totalBytes / CHUNK_SIZE);

    // إرسال إشعار بداية التحميل للطرف الآخر
    sendPacket(targetId, {
      action: 'chunk_start',
      msgId: msgId,
      totalChunks: totalChunks,
      mimeType: fileOrBlob.type,
      msg: { ...msg, loading: true }
    });

    // 4. إرسال الأجزاء تدريجياً لعدم تجميد القناة
    let chunkIndex = 0;
    async function sendNextChunk() {
      if (chunkIndex < totalChunks) {
        const start = chunkIndex * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, totalBytes);
        const chunk = arrayBuffer.slice(start, end);

        sendPacket(targetId, {
          action: 'chunk_data',
          msgId: msgId,
          index: chunkIndex,
          chunk: chunk
        });

        chunkIndex++;
        const percent = Math.floor((chunkIndex / totalChunks) * 100);
        updateProgressUI(msgId, percent);

        // فاصل زمني بسيط جداً (5 مللي ثانية) للسماح للمتصفح بالتنفس
        setTimeout(sendNextChunk, 5);
      } else {
        // تم الانتهاء بنجاح
        msg.loading = false;
        saveChatHistory();
        renderMessages();
      }
    }

    sendNextChunk();
  }

  function handleMediaUpload(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file || !activeChatId) return;

    const isVideo = file.type.startsWith('video');
    sendMediaChunked(file, isVideo ? 'video' : 'image', activeChatId);
  }

  async function toggleVoiceRecording() {
    const btn = document.getElementById('voice-record-btn');
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          sendMediaChunked(blob, 'audio', activeChatId);
        };
        mediaRecorder.start();
        isRecording = true;
        btn.classList.add('recording');
      } catch(e) {
        alert('تعذر فتح الميكروفون: ' + e.message);
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      btn.classList.remove('recording');
    }
  }

  function sendTextMessage() {
    const input = document.getElementById('message-text-input');
    const text = input.value.trim();
    if (!text || !activeChatId) return;

    const msg = {
      id: Date.now() + '-' + Math.random().toString(36).substr(2, 4),
      sender: myId,
      type: 'text',
      content: text,
      time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
      loading: false,
      edited: false,
      deletedEveryone: false,
      deletedForMe: false
    };

    if (!chatHistory[activeChatId]) chatHistory[activeChatId] = [];
    chatHistory[activeChatId].push(msg);
    saveChatHistory();
    renderMessages();

    sendPacket(activeChatId, { action: 'msg', msg });
    input.value = '';
  }

  // ==================== 7. عرض الرسائل مع استرجاع الميديا من IndexedDB ====================
  async function renderMessages() {
    const area = document.getElementById('messagesArea');
    area.innerHTML = '';
    if (!activeChatId) return;

    const list = chatHistory[activeChatId] || [];

    for (const m of list) {
      if (m.deletedForMe) continue;

      const isMe = m.sender === myId;
      const box = document.createElement('div');
      box.className = `msg-box ${isMe ? 'me' : 'them'}`;

      let contentHtml = '';
      if (m.loading) {
        contentHtml = `
          <div class="loader-box">
            <div class="loader-row">
              <div class="spinner"></div>
              <span>جارِ النقل (<span id="txt-${m.id}">0%</span>)...</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="fill-${m.id}"></div>
            </div>
          </div>
        `;
      } else if (m.deletedEveryone) {
        contentHtml = '<span style="font-style:italic;opacity:0.7;">🚫 تم حذف هذه الرسالة</span>';
      } else if (m.type === 'text') {
        contentHtml = `<div>${m.content}</div>`;
      } else {
        // استدعاء من IndexedDB بأمان وبشكل فوري
        let blobUrl = '';
        if (m.mediaKey) {
          const blob = await getMediaBlob(m.mediaKey);
          if (blob) blobUrl = URL.createObjectURL(blob);
        }

        if (blobUrl) {
          if (m.type === 'image') contentHtml = `<img src="${blobUrl}" class="msg-media">`;
          else if (m.type === 'video') contentHtml = `<video src="${blobUrl}" class="msg-media" controls></video>`;
          else if (m.type === 'audio') contentHtml = `<audio src="${blobUrl}" controls></audio>`;
        } else {
          contentHtml = `<span style="font-size:0.8rem;color:var(--text-muted);">⚠️ الوسائط غير متاحة</span>`;
        }
      }

      box.innerHTML = `
        <div class="msg-top-action">
          <div style="flex:1;">${contentHtml}</div>
          ${!m.deletedEveryone && !m.loading ? `<button class="msg-actions-btn" onclick="toggleMsgMenu(event, '${m.id}')">⋮</button>` : ''}
        </div>
        <div class="msg-context-menu" id="ctx-${m.id}">
          ${isMe && m.type === 'text' && !m.deletedEveryone ? `<button onclick="editMsg('${m.id}')">✏️ تعديل</button>` : ''}
          <button onclick="deleteForMe('${m.id}')">🗑️ حذف من جهتي</button>
          ${isMe && !m.deletedEveryone ? `<button style="color:var(--danger);" onclick="deleteForEveryone('${m.id}')">🚫 حذف للطرفين</button>` : ''}
        </div>
        <div class="msg-meta">
          <span>${m.time}</span>
          ${m.edited && !m.deletedEveryone ? '<span>(معدلة)</span>' : ''}
        </div>
      `;
      area.appendChild(box);
    }

    area.scrollTop = area.scrollHeight;
  }

  function toggleMsgMenu(e, id) {
    e.stopPropagation();
    document.querySelectorAll('.msg-context-menu').forEach(m => m.classList.remove('show'));
    const menu = document.getElementById('ctx-' + id);
    if (menu) menu.classList.toggle('show');
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.msg-context-menu').forEach(m => m.classList.remove('show'));
  });

  // ==================== 8. الحذف والتعديل ====================
  function editMsg(id) {
    const m = (chatHistory[activeChatId] || []).find(x => x.id === id);
    if (!m) return;
    const text = prompt('تعديل الرسالة:', m.content);
    if (text && text.trim() !== '') {
      m.content = text.trim();
      m.edited = true;
      saveChatHistory();
      renderMessages();
      sendPacket(activeChatId, { action: 'edit', msgId: id, newContent: m.content });
    }
  }

  function deleteForMe(id) {
    const m = (chatHistory[activeChatId] || []).find(x => x.id === id);
    if (!m) return;
    m.deletedForMe = true;
    saveChatHistory();
    renderMessages();
  }

  function deleteForEveryone(id) {
    const m = (chatHistory[activeChatId] || []).find(x => x.id === id);
    if (!m) return;
    m.deletedEveryone = true;
    if (m.mediaKey) deleteMediaBlob(m.mediaKey);
    saveChatHistory();
    renderMessages();
    sendPacket(activeChatId, { action: 'delete_everyone', msgId: id });
  }

  function deleteEntireChat() {
    if (!activeChatId) return;
    if (confirm('حذف هذه المحادثة بالكامل من الطرفين؟')) {
      (chatHistory[activeChatId] || []).forEach(m => { if (m.mediaKey) deleteMediaBlob(m.mediaKey); });
      chatHistory[activeChatId] = [];
      saveChatHistory();
      renderMessages();
      sendPacket(activeChatId, { action: 'delete_entire_chat' });
    }
  }

  // ==================== 9. الملاحة والقوائم ====================
  function openChat(contactId) {
    activeChatId = contactId;
    const contact = contacts.find(c => c.id === contactId);

    document.getElementById('chat-person-name').textContent = contact.name;
    document.getElementById('chat-person-avatar').src = contact.avatar || BOY_AVATAR;

    connectToFriend(contactId);
    document.getElementById('chatScreen').classList.remove('hidden-left');
    renderMessages();
  }

  function goBackToHome() {
    document.getElementById('chatScreen').classList.add('hidden-left');
    activeChatId = null;
  }

  function renderChatList() {
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    contacts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'chat-item';
      item.onclick = () => openChat(c.id);

      const isOnline = connections[c.id] && connections[c.id].open;

      item.innerHTML = `
        <img class="avatar" src="${c.avatar || BOY_AVATAR}">
        <div class="chat-item-info">
          <div class="chat-item-name">${c.name}</div>
          <div class="chat-item-sub">
            <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
            <span>رقم: ${c.id}</span>
          </div>
        </div>
      `;
      list.appendChild(item);
    });
  }

  function openAddModal() { document.getElementById('addModal').classList.add('open'); }
  function closeModals() { document.getElementById('addModal').classList.remove('open'); }

  function addFriendManual() {
    const name = document.getElementById('add-friend-name').value.trim();
    const id = document.getElementById('add-friend-id').value.trim();
    if (!name || !id) return alert('يرجى ملء الحقول');
    if (id === myId) return alert('لا يمكنك إضافة رقمك الشخصي');

    if (!contacts.some(c => c.id === id)) {
      contacts.push({ id, name, avatar: BOY_AVATAR });
      saveContacts();
      renderChatList();
    }
    closeModals();
    openChat(id);
  }

  function saveContacts() { localStorage.setItem('chat_contacts_list', JSON.stringify(contacts)); }
  function saveChatHistory() {
    // حفظ نصوص الرسائل ومراجع الميديا فقط بدون البيانات الثقيلة لحماية الـ localStorage
    localStorage.setItem('chat_history_data', JSON.stringify(chatHistory));
  }

  // انطلاق التطبيق
  checkOnboarding();
</script>
</body>
