<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>دردشة حية بالأرقام</title>
  <!-- مكتبة الاتصال المباشر بين الأجهزة -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-panel: #111c31;
      --bg-hover: #1e293b;
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --danger: #ef4444;
      --recording: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 950px;
      height: 95vh;
      background: var(--bg-panel);
      border-radius: 20px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      border: 1px solid var(--border);
    }

    /* الشريط الجانبي */
    .sidebar {
      width: 320px;
      background: #0d1626;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .my-profile-box {
      padding: 16px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #000;
      border: 2px solid rgba(255,255,255,0.4);
    }

    .profile-details { flex: 1; overflow: hidden; }
    .profile-details .name { font-weight: bold; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-details .id-badge {
      display: inline-block;
      background: rgba(0,0,0,0.3);
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      margin-top: 3px;
      cursor: pointer;
    }

    .sidebar-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .contacts-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .contact-item {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.2s;
    }
    .contact-item:hover, .contact-item.active { background: var(--bg-hover); }

    /* منطقة الشات الرئيسية */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
    }

    .chat-header {
      padding: 14px 18px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-status {
      padding: 6px 12px;
      font-size: 0.75rem;
      text-align: center;
      background: #1e293b;
      color: #94a3b8;
    }
    .chat-status.connected { background: #064e3b; color: #6ee7b7; }
    .chat-status.error { background: #4c0519; color: #fda4af; }

    .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* فقاعات الرسائل */
    .msg-row {
      display: flex;
      max-width: 75%;
      position: relative;
    }
    .msg-row.me { align-self: flex-start; }
    .msg-row.them { align-self: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      position: relative;
      word-wrap: break-word;
      width: 100%;
    }
    .msg-row.me .bubble {
      background: var(--primary-gradient);
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .msg-row.them .bubble {
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
    }

    .bubble-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .msg-options-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }

    .msg-menu {
      position: absolute;
      top: 30px;
      left: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      z-index: 10;
      display: none;
      flex-direction: column;
      min-width: 140px;
    }
    .msg-menu.open { display: flex; }
    .msg-menu button {
      background: none;
      border: none;
      color: var(--text-main);
      padding: 8px 12px;
      text-align: right;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .msg-menu button:hover { background: var(--bg-hover); }
    .msg-menu button.danger { color: var(--danger); }

    .media-element {
      max-width: 100%;
      max-height: 240px;
      border-radius: 8px;
      display: block;
      margin-top: 6px;
    }

    audio { width: 220px; height: 35px; margin-top: 5px; }

    .meta-info {
      font-size: 0.68rem;
      opacity: 0.7;
      margin-top: 4px;
      display: flex;
      gap: 6px;
    }

    /* Composer */
    .composer {
      padding: 12px 16px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .composer input[type="text"] {
      flex: 1;
      padding: 11px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: white;
      outline: none;
    }

    .btn-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: 0.2s;
    }
    .btn-circle:hover { background: var(--bg-hover); }
    .btn-circle.send { background: var(--primary-gradient); border: none; }
    .btn-circle.recording { background: var(--recording); animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-danger { background: var(--danger); }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--bg-panel);
      padding: 22px;
      border-radius: 12px;
      width: 320px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-box input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: white;
      outline: none;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- الشريط الجانبي -->
  <aside class="sidebar">
    <div class="my-profile-box">
      <img id="my-avatar" class="avatar-img" src="" alt="avatar">
      <div class="profile-details">
        <div class="name"><span id="my-name">مستخدم</span> (<span id="my-age">24</span>)</div>
        <div class="id-badge" onclick="copyId()" title="انقر لنسخ رقمك">
          رقمك: <span id="my-id-display">•••••••</span> 📋
        </div>
      </div>
      <button class="btn-circle" style="width:34px;height:34px;font-size:0.9rem;" onclick="openProfileModal()">⚙️</button>
    </div>

    <div class="sidebar-actions">
      <span style="font-weight: bold; font-size: 0.85rem;">جهات الاتصال</span>
      <button class="btn" onclick="openAddModal()">➕ شخص جديد</button>
    </div>

    <ul class="contacts-list" id="contacts-list"></ul>
  </aside>

  <!-- نافذة المحادثة -->
  <main class="main-chat">
    <div class="chat-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <img id="current-chat-avatar" class="avatar-img" style="width:38px;height:38px;display:none;">
        <div>
          <div id="current-chat-name" style="font-weight:bold;">اختر محادثة</div>
          <div id="current-chat-id" style="font-size:0.75rem; color:var(--text-muted);"></div>
        </div>
      </div>
      <div id="top-chat-actions" style="display:none;">
        <button class="btn btn-danger" onclick="deleteEntireChat()">🗑️ حذف الدردشة للطرفين</button>
      </div>
    </div>

    <div class="chat-status" id="chat-status">جاهز</div>

    <div class="messages-area" id="messages-area"></div>

    <div class="composer">
      <label class="btn-circle" title="إرفاق صورة أو فيديو">
        📎
        <input type="file" id="media-file-input" accept="image/*,video/*" style="display:none;" onchange="sendMediaFile(event)">
      </label>
      <button class="btn-circle" id="voice-btn" onclick="toggleVoiceRecording()" title="تسجيل صوتي">🎤</button>
      <input type="text" id="chat-input" placeholder="اكتب رسالة..." onkeypress="if(event.key === 'Enter') sendText()">
      <button class="btn-circle send" onclick="sendText()">➤</button>
    </div>
  </main>
</div>

<!-- Modal: الإعدادات -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal-box">
    <h3>تعديل الملف الشخصي</h3>
    <label style="font-size:0.8rem;color:var(--text-muted);">صورتك الشخصية:</label>
    <input type="file" id="avatar-input" accept="image/*">
    <input type="text" id="name-input" placeholder="الاسم">
    <input type="number" id="age-input" placeholder="العمر">
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn" style="background:var(--bg-hover);" onclick="closeModals()">إلغاء</button>
      <button class="btn" onclick="saveProfile()">حفظ</button>
    </div>
  </div>
</div>

<!-- Modal: إضافة جهة اتصال -->
<div class="modal-overlay" id="add-modal">
  <div class="modal-box">
    <h3>إضافة شخص بالمحادثة</h3>
    <input type="text" id="friend-name-input" placeholder="اسم الشخص">
    <input type="text" id="friend-id-input" placeholder="رقم الشات المكون من 7 أرقام">
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn" style="background:var(--bg-hover);" onclick="closeModals()">إلغاء</button>
      <button class="btn" onclick="addContact()">إضافة والاتصال</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_AVATAR = 'https://ui-avatars.com/api/?background=6366f1&color=fff&name=U';

  // 1. توليد أو استرجاع رقم شات ثابت للجهاز
  function getMyFixedId() {
    let id = localStorage.getItem('chat_fixed_id');
    if (!id || !/^\d{7}$/.test(id)) {
      id = String(Math.floor(1000000 + Math.random() * 9000000));
      localStorage.setItem('chat_fixed_id', id);
    }
    return id;
  }

  const myId = getMyFixedId();
  let myProfile = JSON.parse(localStorage.getItem('chat_user_profile')) || {
    name: 'أنا',
    age: '25',
    avatar: DEFAULT_AVATAR
  };
  let contacts = JSON.parse(localStorage.getItem('chat_contacts_list')) || [];
  let chatHistory = JSON.parse(localStorage.getItem('chat_messages_history')) || {};

  let currentTargetId = null;
  let peer = null;
  let activeConn = null;

  // تسجيل الصوت
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  // 2. تهيئة PeerJS للاتصال P2P الحقيقي
  function initPeer() {
    peer = new Peer('chat-' + myId, { debug: 1 });

    peer.on('open', () => {
      setStatus('جاهز للاتصال ✓', 'connected');
    });

    // عند استقبال اتصال من صديق
    peer.on('connection', (conn) => {
      activeConn = conn;
      setupConnectionEvents(conn);
      const incomingId = conn.peer.replace('chat-', '');
      if (!contacts.some(c => c.id === incomingId)) {
        contacts.push({ id: incomingId, name: 'مستخدم ' + incomingId, avatar: DEFAULT_AVATAR });
        saveContacts();
      }
      selectContact(incomingId, false);
    });

    peer.on('error', (err) => {
      if (err.type === 'peer-unavailable') {
        setStatus('❌ الطرف الآخر غير متصل حالياً', 'error');
      } else {
        setStatus('تنبيه: ' + err.type, 'error');
      }
    });
  }

  function setupConnectionEvents(conn) {
    conn.on('open', () => {
      setStatus('متصل الآن 🔗', 'connected');
      document.getElementById('top-chat-actions').style.display = 'block';
    });

    // استقبال الرسائل والأوامر الحية
    conn.on('data', (packet) => {
      handleIncomingData(packet);
    });

    conn.on('close', () => {
      setStatus('انقطع الاتصال بالطرف الآخر', 'error');
    });
  }

  function connectToPeer(targetId) {
    if (!peer || !peer.open) return;
    setStatus('جارٍ الاتصال بـ ' + targetId + '...', '');
    if (activeConn) { try { activeConn.close(); } catch(e){} }
    activeConn = peer.connect('chat-' + targetId, { reliable: true });
    setupConnectionEvents(activeConn);
  }

  // 3. معالجة الرسائل الواردة
  function handleIncomingData(data) {
    if (data.action === 'new_msg') {
      appendMessageToStore(currentTargetId, data.msg);
    } else if (data.action === 'edit_msg') {
      const list = chatHistory[currentTargetId] || [];
      const m = list.find(x => x.id === data.msgId);
      if (m) {
        m.content = data.newContent;
        m.edited = true;
        saveHistory();
        renderMessages();
      }
    } else if (data.action === 'delete_for_everyone') {
      const list = chatHistory[currentTargetId] || [];
      const m = list.find(x => x.id === data.msgId);
      if (m) {
        m.deletedEveryone = true;
        saveHistory();
        renderMessages();
      }
    } else if (data.action === 'delete_entire_chat') {
      chatHistory[currentTargetId] = [];
      saveHistory();
      renderMessages();
      alert('قام الطرف الآخر بحذف المحادثة بالكامل.');
    }
  }

  // 4. إرسال البيانات
  function emitToPeer(packet) {
    if (activeConn && activeConn.open) {
      activeConn.send(packet);
    }
  }

  function appendMessageToStore(contactId, msgObj) {
    if (!chatHistory[contactId]) chatHistory[contactId] = [];
    chatHistory[contactId].push(msgObj);
    saveHistory();
    renderMessages();
  }

  function sendText() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !currentTargetId) return;

    const msg = {
      id: Date.now() + '-' + Math.random().toString(36).substr(2, 4),
      sender: myId,
      type: 'text',
      content: text,
      time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
      edited: false,
      deletedEveryone: false,
      deletedForMe: false
    };

    appendMessageToStore(currentTargetId, msg);
    emitToPeer({ action: 'new_msg', msg });
    input.value = '';
  }

  function sendMediaFile(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file || !currentTargetId) return;

    const isVideo = file.type.startsWith('video');
    const reader = new FileReader();
    reader.onload = () => {
      const msg = {
        id: Date.now() + '-' + Math.random().toString(36).substr(2, 4),
        sender: myId,
        type: isVideo ? 'video' : 'image',
        content: reader.result,
        time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
        edited: false,
        deletedEveryone: false,
        deletedForMe: false
      };
      appendMessageToStore(currentTargetId, msg);
      emitToPeer({ action: 'new_msg', msg });
    };
    reader.readAsDataURL(file);
  }

  async function toggleVoiceRecording() {
    const btn = document.getElementById('voice-btn');
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = () => {
            const msg = {
              id: Date.now() + '-' + Math.random().toString(36).substr(2, 4),
              sender: myId,
              type: 'audio',
              content: reader.result,
              time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
              edited: false,
              deletedEveryone: false,
              deletedForMe: false
            };
            appendMessageToStore(currentTargetId, msg);
            emitToPeer({ action: 'new_msg', msg });
          };
          reader.readAsDataURL(blob);
        };
        mediaRecorder.start();
        isRecording = true;
        btn.classList.add('recording');
      } catch(e) {
        alert('تعذر فتح الميكروفون: ' + e.message);
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      btn.classList.remove('recording');
    }
  }

  // 5. التعديل والحذف
  function editMsg(msgId) {
    const msg = (chatHistory[currentTargetId] || []).find(x => x.id === msgId);
    if (!msg) return;
    const newContent = prompt('تعديل الرسالة:', msg.content);
    if (newContent && newContent.trim() !== '') {
      msg.content = newContent.trim();
      msg.edited = true;
      saveHistory();
      renderMessages();
      emitToPeer({ action: 'edit_msg', msgId, newContent: msg.content });
    }
  }

  function deleteForMe(msgId) {
    const msg = (chatHistory[currentTargetId] || []).find(x => x.id === msgId);
    if (!msg) return;
    msg.deletedForMe = true;
    saveHistory();
    renderMessages();
  }

  function deleteForEveryone(msgId) {
    const msg = (chatHistory[currentTargetId] || []).find(x => x.id === msgId);
    if (!msg) return;
    msg.deletedEveryone = true;
    saveHistory();
    renderMessages();
    emitToPeer({ action: 'delete_for_everyone', msgId });
  }

  function deleteEntireChat() {
    if (!currentTargetId) return;
    if (confirm('هل أنت متأكد من حذف هذه المحادثة بالكامل من كلا الطرفين؟')) {
      chatHistory[currentTargetId] = [];
      saveHistory();
      renderMessages();
      emitToPeer({ action: 'delete_entire_chat' });
    }
  }

  // 6. عرض المحتوى والواجهة
  function renderMessages() {
    const area = document.getElementById('messages-area');
    area.innerHTML = '';
    if (!currentTargetId) return;

    const list = chatHistory[currentTargetId] || [];

    list.forEach(m => {
      if (m.deletedForMe) return;

      const isMe = m.sender === myId;
      const row = document.createElement('div');
      row.className = `msg-row ${isMe ? 'me' : 'them'}`;

      let body = '';
      if (m.deletedEveryone) {
        body = `<span style="font-style:italic;opacity:0.7;">🚫 تم حذف الرسالة</span>`;
      } else if (m.type === 'text') {
        body = `<div>${m.content}</div>`;
      } else if (m.type === 'image') {
        body = `<img src="${m.content}" class="media-element">`;
      } else if (m.type === 'video') {
        body = `<video src="${m.content}" class="media-element" controls></video>`;
      } else if (m.type === 'audio') {
        body = `<audio src="${m.content}" controls></audio>`;
      }

      row.innerHTML = `
        <div class="bubble">
          <div class="bubble-header">
            ${body}
            ${!m.deletedEveryone ? `<button class="msg-options-btn" onclick="toggleMsgMenu(event, '${m.id}')">⋮</button>` : ''}
          </div>
          <div class="msg-menu" id="menu-${m.id}">
            ${isMe && m.type === 'text' && !m.deletedEveryone ? `<button onclick="editMsg('${m.id}')">✏️ تعديل</button>` : ''}
            <button onclick="deleteForMe('${m.id}')">🗑️ حذف من جهتي</button>
            ${isMe && !m.deletedEveryone ? `<button class="danger" onclick="deleteForEveryone('${m.id}')">🚫 حذف للطرفين</button>` : ''}
          </div>
          <div class="meta-info">
            <span>${m.time}</span>
            ${m.edited && !m.deletedEveryone ? '<span>(معدلة)</span>' : ''}
          </div>
        </div>
      `;
      area.appendChild(row);
    });

    area.scrollTop = area.scrollHeight;
  }

  function toggleMsgMenu(e, id) {
    e.stopPropagation();
    document.querySelectorAll('.msg-menu').forEach(m => m.classList.remove('open'));
    const menu = document.getElementById('menu-' + id);
    if (menu) menu.classList.toggle('open');
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.msg-menu').forEach(m => m.classList.remove('open'));
  });

  function selectContact(targetId, shouldConnect = true) {
    currentTargetId = targetId;
    const c = contacts.find(x => x.id === targetId) || { name: 'مستخدم ' + targetId, avatar: DEFAULT_AVATAR };

    document.getElementById('current-chat-name').textContent = c.name;
    document.getElementById('current-chat-id').textContent = 'رقم: ' + targetId;
    const av = document.getElementById('current-chat-avatar');
    av.src = c.avatar || DEFAULT_AVATAR;
    av.style.display = 'block';

    renderContacts();
    renderMessages();

    if (shouldConnect) connectToPeer(targetId);
  }

  function renderContacts() {
    const list = document.getElementById('contacts-list');
    list.innerHTML = '';
    contacts.forEach(c => {
      const li = document.createElement('li');
      li.className = `contact-item ${currentTargetId === c.id ? 'active' : ''}`;
      li.onclick = () => selectContact(c.id);
      li.innerHTML = `
        <img src="${c.avatar || DEFAULT_AVATAR}" class="avatar-img" style="width:40px;height:40px;">
        <div>
          <div style="font-weight:600;font-size:0.9rem;">${c.name}</div>
          <div style="font-size:0.75rem;color:var(--text-muted);">${c.id}</div>
        </div>
      `;
      list.appendChild(li);
    });
  }

  function addContact() {
    const name = document.getElementById('friend-name-input').value.trim();
    const id = document.getElementById('friend-id-input').value.trim();
    if (!name || !id) return alert('يرجى ملء الحقول');
    if (id === myId) return alert('لا يمكنك إضافة رقمك الشخصي');

    if (!contacts.some(c => c.id === id)) {
      contacts.push({ id, name, avatar: DEFAULT_AVATAR });
      saveContacts();
    }
    closeModals();
    selectContact(id);
  }

  // 7. إدارة الملف الشخصي
  function saveProfile() {
    const name = document.getElementById('name-input').value.trim();
    const age = document.getElementById('age-input').value.trim();
    const file = document.getElementById('avatar-input').files[0];

    if (name) myProfile.name = name;
    if (age) myProfile.age = age;

    if (file) {
      const reader = new FileReader();
      reader.onload = () => {
        myProfile.avatar = reader.result;
        saveProfileData();
      };
      reader.readAsDataURL(file);
    } else {
      saveProfileData();
    }
  }

  function saveProfileData() {
    localStorage.setItem('chat_user_profile', JSON.stringify(myProfile));
    updateProfileUI();
    closeModals();
  }

  function updateProfileUI() {
    document.getElementById('my-id-display').textContent = myId;
    document.getElementById('my-name').textContent = myProfile.name;
    document.getElementById('my-age').textContent = myProfile.age;
    document.getElementById('my-avatar').src = myProfile.avatar || DEFAULT_AVATAR;
  }

  function saveContacts() {
    localStorage.setItem('chat_contacts_list', JSON.stringify(contacts));
    renderContacts();
  }

  function saveHistory() {
    localStorage.setItem('chat_messages_history', JSON.stringify(chatHistory));
  }

  function setStatus(text, type) {
    const bar = document.getElementById('chat-status');
    bar.textContent = text;
    bar.className = 'chat-status ' + (type || '');
  }

  function copyId() {
    navigator.clipboard.writeText(myId);
    alert('تم نسخ رقمك الثابت: ' + myId);
  }

  function openProfileModal() {
    document.getElementById('name-input').value = myProfile.name;
    document.getElementById('age-input').value = myProfile.age;
    document.getElementById('profile-modal').classList.add('open');
  }

  function openAddModal() {
    document.getElementById('add-modal').classList.add('open');
  }

  function closeModals() {
    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
  }

  // بدء التطبيق
  updateProfileUI();
  renderContacts();
  initPeer();
</script>
</body>
</html>
